services:
  app:
    build:
      context: .
    ports:
      - "${RAG_PORT:-8001}:8001"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-1200}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run setup.command or setup.bat before starting the stack.}
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8001
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_ENABLE_DEEP_FETCH: ${RAG_ENABLE_DEEP_FETCH:-false}
      RAG_CORPUS_RECHECK_DAYS: ${RAG_CORPUS_RECHECK_DAYS:-30}
      # Managed deployments check the public corpus on startup and periodically.
      # Set false only for a deliberately frozen evaluation environment.
      RAG_STARTUP_CORPUS_UPDATE_ENABLED: ${RAG_STARTUP_CORPUS_UPDATE_ENABLED:-true}
      RAG_CORPUS_UPDATE_INTERVAL_SECONDS: ${RAG_CORPUS_UPDATE_INTERVAL_SECONDS:-21600}
      RAG_UPSTREAM_CORPUS_URL: ${RAG_UPSTREAM_CORPUS_URL:-https://conradgui.github.io/AI-TREND-RADAR}
      RAG_RUNTIME_CORPUS_MANIFEST: /app/digests/.runtime-manifest.json
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OMP_NUM_THREADS: ${RAG_EMBEDDING_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${RAG_EMBEDDING_THREADS:-1}
      MKL_NUM_THREADS: ${RAG_EMBEDDING_THREADS:-1}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - rag_data:/app/rag/data
      # Synced reports are canonical input, so they must survive app rebuilds.
      - corpus_data:/app/digests
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    cpus: ${RAG_APP_CPUS:-1.5}
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run setup.command or setup.bat before starting the stack.}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    cpus: ${RAG_NEO4J_CPUS:-1.5}
    restart: unless-stopped

volumes:
  neo4j_data:
  rag_data:
  corpus_data:
