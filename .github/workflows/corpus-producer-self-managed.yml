name: Corpus Producer (self-managed)

on:
  schedule:
    # Runs only when repository variable CORPUS_MODE is explicitly self_managed.
    - cron: "43 0 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider used to generate the daily corpus
        required: true
        default: deepseek
        type: choice
        options:
          - deepseek
          - anthropic
          - openai
          - openrouter
          - github-models
      publish:
        description: Commit the generated corpus to the default branch
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  models: read

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.publish) && 'corpus-publish' || format('corpus-preview-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SELF_MANAGED_UPDATE_BRANCH: automation/self-managed-corpus

jobs:
  produce:
    name: Generate and validate corpus
    if: github.event_name == 'workflow_dispatch' || vars.CORPUS_MODE == 'self_managed'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight provider and publish boundary
        env:
          SELECTED_PROVIDER: ${{ inputs.provider || vars.SELF_MANAGED_LLM_PROVIDER || 'deepseek' }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$SELECTED_PROVIDER" in
            deepseek) required_secret="DEEPSEEK_API_KEY" ;;
            anthropic) required_secret="ANTHROPIC_API_KEY" ;;
            openai) required_secret="OPENAI_API_KEY" ;;
            openrouter) required_secret="OPENROUTER_API_KEY" ;;
            github-models) required_secret="GITHUB_TOKEN" ;;
            *) echo "::error title=Invalid provider::Unsupported provider: $SELECTED_PROVIDER"; exit 1 ;;
          esac

          if [[ -z "${!required_secret:-}" ]]; then
            echo "::error title=Missing required secret::Configure $required_secret for provider $SELECTED_PROVIDER"
            exit 1
          fi

          runtime_provider="$SELECTED_PROVIDER"
          case "$SELECTED_PROVIDER" in
            github-models) runtime_provider="github-copilot" ;;
          esac
          echo "RUNTIME_PROVIDER=$runtime_provider" >> "$GITHUB_ENV"

          if [[ "$PUBLISH_REQUESTED" == "true" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error title=Unsafe publish branch::Publishing is allowed only from $DEFAULT_BRANCH"
            exit 1
          fi

          echo "Provider preflight passed for $SELECTED_PROVIDER; secret values were not printed."

      - name: Generate daily corpus
        env:
          LLM_PROVIDER: ${{ env.RUNTIME_PROVIDER }}
          REPORT_LANGS: zh
          SAVE_SOURCE_REPORTS: "0"
          GITHUB_TOKEN: ${{ secrets.AI_RADAR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: |
          pnpm sources:check
          pnpm digest

      - name: Build auditable corpus contract
        run: python -m rag.corpus_contract --source-mode self_managed

      - name: Record source revision
        run: git rev-parse HEAD > corpus-base-revision.txt

      - name: Validate generated files
        run: |
          test -s manifest.json
          test -s feed.xml
          test -s corpus-manifest.json
          test -d digests
          git diff --check -- digests/ manifest.json feed.xml corpus-manifest.json

      - name: Upload generated corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-managed-corpus-${{ github.run_id }}
          path: |
            digests/
            manifest.json
            feed.xml
            corpus-manifest.json
            corpus-base-revision.txt
          if-no-files-found: error
          retention-days: 3

      - name: Write producer summary
        if: ${{ always() }}
        run: |
          {
            echo "## Self-managed corpus producer"
            echo "- Provider: \`${{ inputs.provider || vars.SELF_MANAGED_LLM_PROVIDER || 'deepseek' }}\`"
            echo "- Publish requested: \`${{ github.event_name == 'schedule' || inputs.publish }}\`"
            echo "- Product Hunt: ${{ secrets.PRODUCTHUNT_TOKEN != '' && 'enabled' || 'skipped (optional secret missing)' }}"
            echo "- Gitee: ${{ secrets.GITEE_TOKEN != '' && 'enabled' || 'skipped (optional secret missing)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish self-managed corpus
    needs: produce
    if: needs.produce.result == 'success' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.pr_delivery.outputs.merged }}
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download generated corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: self-managed-corpus-${{ github.run_id }}
          path: .

      - name: Prepare dedicated corpus branch
        run: git switch -C "$SELF_MANAGED_UPDATE_BRANCH"

      - name: Reject stale producer snapshot
        run: |
          expected_revision=$(cat corpus-base-revision.txt)
          current_revision=$(git rev-parse HEAD)
          if [[ "$expected_revision" != "$current_revision" ]]; then
            echo "::error title=Stale producer snapshot::Default branch changed during generation; rerun the producer."
            exit 1
          fi

      - name: Setup Python for contract verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Rebuild corpus contract before commit
        run: python -m rag.corpus_contract --source-mode self_managed

      - name: Commit generated corpus
        id: corpus_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/ manifest.json feed.xml corpus-manifest.json
          if git diff --cached --quiet; then
            echo "Generated corpus contains no changes" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "corpus: publish self-managed ${DATE}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "validated_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Prepared self-managed corpus for ${DATE}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push dedicated corpus branch
        if: steps.corpus_commit.outputs.changed == 'true'
        run: git push --force-with-lease origin HEAD:"$SELF_MANAGED_UPDATE_BRANCH"

      - name: Create and merge corpus pull request
        id: pr_delivery
        if: steps.corpus_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATED_SHA: ${{ steps.corpus_commit.outputs.validated_sha }}
        run: |
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$SELF_MANAGED_UPDATE_BRANCH" \
            --base "$DEFAULT_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -z "$pr_number" ]; then
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$SELF_MANAGED_UPDATE_BRANCH" \
              --base "$DEFAULT_BRANCH" \
              --title "corpus: automated self-managed update" \
              --body "Automated self-managed corpus update. Source preflight, ATR identity, search-index coverage, and corpus-contract gates passed before this PR was created.")
            pr_number=$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')
          fi

          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$VALIDATED_SHA"
          pr_state=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
          test "$pr_state" = "MERGED"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "Merged self-managed corpus PR #${pr_number}" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    name: Deploy published corpus to Pages
    needs: publish
    if: ${{ needs.publish.result == 'success' && needs.publish.outputs.merged == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
